# CI — Build, Test, Lint
# Runs on push to main, PRs, and manual dispatch
# Conventional commit detection: `docs:` prefix skips CI

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip_docs: ${{ steps.docs.outputs.skip_docs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - id: docs
        run: |
          MSG=$(git log --format=%B -n 1 "$GITHUB_SHA" | head -1)
          if [[ "$MSG" =~ ^docs?: ]]; then
            echo "skip_docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_docs=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: gate
    if: needs.gate.outputs.skip_docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

