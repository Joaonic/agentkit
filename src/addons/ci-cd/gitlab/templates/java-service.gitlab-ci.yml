# GitLab CI/CD — Java/Maven/Spring Boot Service
# Trunk-based: CI on MR/main, auto changelog+tag on main, Docker build+deploy on tags
#
# Required CI/CD variables:
#   OPENAI_GROUP_KEY  — OpenAI API key for changelog generation
#   SSH_PRIVATE_KEY   — Deploy key (File type)
#   SSH_KNOWN_HOSTS   — Known hosts file (File type)
#   REMOTE_SSH        — Deploy target (user@host)

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: '$CI_COMMIT_MESSAGE =~ /^release:/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

image: maven:3.9-eclipse-temurin-21

cache:
  paths:
    - .m2/repository

stages:
  - build
  - qa
  - prepare_scripts
  - generate_docs
  - publish
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  MAVEN_CLI_OPTS: "-s ci_settings.xml --batch-mode --errors --fail-at-end --show-version -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  SCRIPTS_DIR: 'scripts_dir'
  CHATGPT_API_KEY: $OPENAI_GROUP_KEY

before_script:
  - export MAVEN_CLI_OPTS="$MAVEN_CLI_OPTS"
  - git config --global user.email "$GITLAB_USER_EMAIL"
  - git config --global user.name "$GITLAB_USER_NAME"

build:
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS clean install -DskipTests
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /^doc:/
      when: never
    - when: on_success

tests:
  stage: qa
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    - mvn $MAVEN_CLI_OPTS verify
    - awk -F"," '{ instructions += $4 + $5; covered += $5 } END { print covered, "/", instructions, " instructions covered"; print 100*covered/instructions, "% covered" }' target/site/jacoco/jacoco.csv
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /^doc:/
      when: never
    - when: on_success
  coverage: '/\d+.\d+ \% covered/'
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml

# --- Changelog generation (include your prepare-scripts job) ---
# generate_changelog:
#   stage: prepare_scripts
#   script:
#     - $SCRIPTS_DIR/generate_changelog.sh "$CHATGPT_API_KEY" "$VERSION"
#   only:
#     - main

tag_version:
  before_script:
    - export MAVEN_CLI_OPTS="$MAVEN_CLI_OPTS"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    - git config --global user.name "$GITLAB_USER_NAME"
    - |
      export UPDATE_TYPE="patch"
      REGEX=".*\[(minor|major|patch)\].*"
      if [[ "$CI_COMMIT_MESSAGE" =~ $REGEX ]]; then
        export UPDATE_TYPE="${BASH_REMATCH[1]}"
      fi
      echo "Update type: $UPDATE_TYPE"
  stage: publish
  script:
    - source $SCRIPTS_DIR/java/maven_helpers.sh
    - source $SCRIPTS_DIR/git_helpers.sh
    - increment_version $UPDATE_TYPE
    - VERSION="$(get_pom_version)"
    - configure_remote
    - add_commit_and_push pom.xml "release: automatic incremented $UPDATE_TYPE version to $VERSION"
    - $SCRIPTS_DIR/tag_version.sh "$CHATGPT_API_KEY" "$VERSION"
  only:
    - main
  needs:
    - build
    - tests

build-and-push-arm64:
  image: docker:latest
  services:
    - docker:dind
  tags:
    - saas-linux-small-arm64
  before_script:
    - docker info
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  stage: publish
  script:
    - docker build --platform linux/arm64/v8 --pull -t "$DOCKER_IMAGE_NAME-arm64" .
    - docker push "$DOCKER_IMAGE_NAME-arm64"
  only:
    - tags

build-and-push-amd64:
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker info
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  stage: publish
  script:
    - docker build --pull -t "$DOCKER_IMAGE_NAME-amd" .
    - docker push "$DOCKER_IMAGE_NAME-amd"
  only:
    - tags

publish_manifest:
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker info
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  stage: publish
  script:
    - docker manifest create "${CI_REGISTRY_IMAGE}:latest" --amend "${DOCKER_IMAGE_NAME}-amd" --amend "${DOCKER_IMAGE_NAME}-arm64"
    - docker manifest push "${CI_REGISTRY_IMAGE}:latest"
  only:
    - tags
  needs:
    - build-and-push-arm64
    - build-and-push-amd64

deploy:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying to production..."
    - ssh "$REMOTE_SSH" "cd /home/ubuntu/deploy/${CI_PROJECT_NAME} && sed -i 's/^IMAGE_VERSION=.*/IMAGE_VERSION=${CI_COMMIT_REF_SLUG}-arm64/' .env && docker compose up --build -d"
  only:
    - tags
  needs:
    - build-and-push-arm64
