# GitLab CI/CD — Node.js Service
# Trunk-based: CI on MR/main, auto changelog+tag on main, Docker build+deploy on tags

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: '$CI_COMMIT_MESSAGE =~ /^release:/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

image: node:22-alpine

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_IMAGE_BASE: $CI_REGISTRY_IMAGE
  SCRIPTS_DIR: './scripts_dir'
  CHATGPT_API_KEY: $OPENAI_GROUP_KEY

stages:
  - verify
  - prepare_scripts
  - tag_version
  - publish
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
  policy: pull-push

verify:
  stage: verify
  before_script:
    - npm ci
  script:
    - npm run lint --if-present
    - npm test --if-present
    - npm run build --if-present
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /^doc:/
      when: never
    - when: on_success

tag_version:
  stage: tag_version
  before_script:
    - apk add --no-cache git bash curl
    - git config --global user.email "$GITLAB_USER_EMAIL"
    - git config --global user.name "$GITLAB_USER_NAME"
    - |
      export UPDATE_TYPE="patch"
      REGEX=".*\[(minor|major|patch)\].*"
      if [[ "$CI_COMMIT_MESSAGE" =~ $REGEX ]]; then
        export UPDATE_TYPE="${BASH_REMATCH[1]}"
      fi
      echo "Update type: $UPDATE_TYPE"
  script:
    - source $SCRIPTS_DIR/node/node_helpers.sh
    - source $SCRIPTS_DIR/git_helpers.sh
    - increment_version $UPDATE_TYPE
    - VERSION="$(get_package_version)"
    - configure_remote
    - add_commit_and_push package.json "release: automatic incremented $UPDATE_TYPE version to $VERSION"
    - $SCRIPTS_DIR/tag_version.sh "$CHATGPT_API_KEY" "$VERSION"
  only:
    - main
  needs:
    - verify

build-and-push-arm64:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  tags:
    - saas-linux-small-arm64
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build --platform linux/arm64 --pull -t "${DOCKER_IMAGE_BASE}:${CI_COMMIT_REF_SLUG}-arm64" .
    - docker push "${DOCKER_IMAGE_BASE}:${CI_COMMIT_REF_SLUG}-arm64"
  only:
    - tags

build-and-push-amd64:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build --platform linux/amd64 --pull -t "${DOCKER_IMAGE_BASE}:${CI_COMMIT_REF_SLUG}-amd64" .
    - docker push "${DOCKER_IMAGE_BASE}:${CI_COMMIT_REF_SLUG}-amd64"
  only:
    - tags

publish_manifest:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker manifest create "${DOCKER_IMAGE_BASE}:latest" --amend "${DOCKER_IMAGE_BASE}:${CI_COMMIT_REF_SLUG}-amd64" --amend "${DOCKER_IMAGE_BASE}:${CI_COMMIT_REF_SLUG}-arm64"
    - docker manifest push "${DOCKER_IMAGE_BASE}:latest"
  needs:
    - build-and-push-amd64
    - build-and-push-arm64
  only:
    - tags

deploy_production:
  stage: deploy
  image: docker:27
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying to production..."
    - ssh "$REMOTE_SSH" "cd /home/ubuntu/deploy/${CI_PROJECT_NAME} && sed -i 's/^IMAGE_VERSION=.*/IMAGE_VERSION=${CI_COMMIT_REF_SLUG}-arm64/' .env && docker compose up --build -d"
  only:
    - tags
  needs:
    - build-and-push-arm64
